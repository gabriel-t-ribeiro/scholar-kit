name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install zero-dependency core + dev tools (without cmudict)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pdf,dev]"

      - name: Lint with ruff
        run: ruff check writing_guard tests

      - name: Run pytest without cmudict (heuristic EN fallback)
        run: pytest -v

      - name: Install cmudict (exact EN syllable dictionary)
        run: pip install -e ".[writing,dev]"

      - name: Run pytest with cmudict
        run: pytest -v
